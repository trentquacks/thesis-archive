{% extends 'base.html' %}

{% block title %} Complete Profile {% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
{% endblock %}

{% block content %}
<main class="flex-grow flex flex-col items-center justify-center pt-10">
    <div class="bg-white border border-sage-200 w-full max-w-lg p-8 rounded-xl shadow-sm">
        
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-sage-100 text-sage-600 rounded-full mb-4">
                <i class="fa-brands fa-google text-2xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-sage-800 mb-2">Almost there!</h1>
            <p class="text-sage-600 text-sm">We need a few more details to finalize your CvSU account setup.</p>
        </div>

        <form method="post" class="space-y-5">
            
            <div class="bg-sage-50 p-4 rounded-lg border border-sage-200 mb-6 flex flex-col gap-1">
                <span class="text-xs text-sage-600 uppercase font-bold tracking-wider">Linked Google Account</span>
                <span class="font-bold text-sage-800 text-lg">{{ first_name }} {{ last_name }}</span>
                <span class="text-sm text-sage-600">{{ email }}</span>
            </div>

            <div class="space-y-1">
                <label class="text-sm font-bold text-sage-700">Student Number:</label>
                <input name="student_no" type="text" id="student_no" class="w-full bg-white border border-sage-300 text-sage-800 p-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-sage-500 focus:border-sage-500 transition-all" placeholder="e.g. 202610226" required>
            </div>
            
            <div class="space-y-1">
                <label class="text-sm font-bold text-sage-700">Program / Course:</label>
                <select name="course" class="w-full bg-white border border-sage-300 text-sage-800 p-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-sage-500 focus:border-sage-500 transition-all cursor-pointer" required>
                    <option value="" disabled selected>Select your program</option>
                    <option value="BS Business Administration">BS Business Administration</option>
                    <option value="BS Computer Science">BS Computer Science</option>
                    <option value="Bachelor of Education">Bachelor of Education</option>
                    <option value="BS Entrepreneurship">BS Entrepreneurship</option>
                    <option value="BS Hospitality Management">BS Hospitality Management</option>
                    <option value="BS Information Technology">BS Information Technology</option>
                    <option value="BA Journalism">BA Journalism</option>
                    <option value="BS Office Administration">BS Office Administration</option>
                    <option value="BS Psychology">BS Psychology</option>
                </select>
            </div>

            <div class="pt-6">
                <button type="submit" class="w-full bg-sage-500 hover:bg-sage-600 text-white font-bold py-3 px-4 rounded-lg shadow-sm transition-colors">
                    Complete Registration
                </button>
            </div>

        </form>
    </div>
</main>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const studentNoInput = document.getElementById('student_no');
        if (studentNoInput) {
            studentNoInput.addEventListener('input', function(e) {
                this.value = this.value.replace(/[^0-9-]/g, ''); 
            });
        }
    });
</script>
{% endblock %}
