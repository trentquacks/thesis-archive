{% extends 'base.html' %}

{% block title %} Login {% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
{% endblock %}

{% block content %}
<main class="flex-grow flex flex-col items-center justify-center pt-10 pb-10">
    <div class="bg-white border border-sage-200 w-full max-w-md p-8 rounded-xl shadow-sm">
        
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-sage-100 text-sage-600 rounded-full mb-4">
                <i class="fa-solid fa-lock text-2xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-sage-800 mb-2">Welcome Back</h1>
            <p class="text-sage-600 text-sm">Sign in to your account to continue.</p>
        </div>

        <form method="post" class="space-y-5">

            <div class="space-y-1">
                <label class="text-sm font-bold text-sage-700">Email Address:</label>
                <input name="email" type="email" class="w-full bg-white border border-sage-300 text-sage-800 p-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-sage-500 focus:border-sage-500 transition-all" required>
            </div>

            <div class="space-y-1 relative">
                <label class="text-sm font-bold text-sage-700">Password:</label>
                <div class="relative w-full">
                    <input name="password" id="login_password" type="password" class="w-full bg-white border border-sage-300 text-sage-800 p-3 pr-12 rounded-lg focus:outline-none focus:ring-2 focus:ring-sage-500 focus:border-sage-500 transition-all" required>
                    <div class="absolute right-4 top-1/2 -translate-y-1/2 opacity-50 hover:opacity-100 transition cursor-pointer toggle-password" data-target="login_password">
                        <i class="fa-solid fa-eye-slash text-lg"></i>
                    </div>
                </div>
            </div>

            <div class="pt-4 flex flex-col items-center gap-4 w-full">
                <button type="submit" class="w-full bg-sage-500 hover:bg-sage-600 text-white font-bold py-3 px-4 rounded-lg shadow-sm transition-colors">
                    Sign In
                </button>
                
                <div class="w-full flex items-center py-2">
                    <div class="flex-grow border-t border-sage-200"></div>
                    <span class="flex-shrink-0 mx-4 text-sage-400 text-sm font-bold">OR</span>
                    <div class="flex-grow border-t border-sage-200"></div>
                </div>

                <a href="{{ url_for('auth.google_login') }}" class="w-full flex items-center justify-center gap-3 bg-white border-2 border-sage-200 text-sage-700 font-bold py-3 px-4 rounded-lg hover:bg-sage-50 hover:border-sage-300 hover:shadow-sm transition-all">
                    <img src="https://developers.google.com/identity/images/g-logo.png" alt="Google Logo" class="w-5 h-5">
                    Sign in with CvSU Account
                </a>
            </div>

        </form>
    </div>
</main>
{% endblock %}
