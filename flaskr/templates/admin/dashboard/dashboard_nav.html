<div class="bg-theme-surface p-4 rounded-xl shadow-sm border border-theme-border shrink-0 flex items-center justify-center sm:justify-start">
    <div class="flex flex-col sm:flex-row bg-theme-secondary p-1 rounded-lg border border-theme-border w-full sm:w-auto">
        {% set tabs = [('admin.dashboard_stats', 'Stats View', 'fa-chart-simple'), 
                       ('admin.dashboard_projects', 'Projects View', 'fa-folder-open'), 
                       ('admin.dashboard_accounts', 'Registered Accounts', 'fa-users')] %}
        
        {% for route, label, icon in tabs %}
        <a href="{{ url_for(route) }}" 
           class="flex-1 sm:flex-none text-center px-6 py-2 rounded-md font-bold transition-all 
                  {% if request.endpoint == route %}bg-theme-surface shadow-sm text-theme-primary{% else %}text-theme-muted hover:text-theme-text hover:bg-theme-tertiary{% endif %}">
            <i class="fa-solid {{ icon }} mr-2"></i> {{ label }}
        </a>
        {% endfor %}
    </div>
</div>
