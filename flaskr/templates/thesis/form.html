{% extends 'sidebar.html' %}

{% block title %} Dashboard {% endblock %}
{% block style %} {{ url_for('static', filename='index_style.css') }} {% endblock %}

{% block main %}
<main class="flex-1 flex flex-col gap-6">
    <div class="card-sage p-6 flex-1 flex flex-col min-h-0">
        <h2 class="text-3xl font-bold mb-2 ">Thesis Submission Form</h2>

        <div class="flex-1  gap-4 overflow-y-auto pr-3">
            <form class="flex flex-col gap-8">
                
                <div class="grid grid-cols-1 md:grid-cols-4 ">
                    <div class="md:col-span-1 flex items-start ">
                        <label class="font-bold text-lg">Authors</label>
                    </div>
                    <div class="md:col-span-3 flex flex-col ">
                        <div class="grid grid-cols-3 gap-4">
                            <div class="flex flex-col ">
                                <input type="text" class="w-full p-2 " />
                                <span class="text-sm italic">Last Name</span>
                            </div>
                            <div class="flex flex-col ">
                                <input type="text" class="w-full p-2 " />
                                <span class="text-sm italic">First Name</span>
                            </div>
                            <div class="flex flex-col ">
                                <input type="text" class="w-full p-2" />
                                <span class="text-sm italic">Middle Initial</span>
                            </div>
                        </div>
                        
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-4 items-center">
                    <div class="md:col-span-1">
                        <label class="font-bold text-lg">Research Title</label>
                    </div>
                    <div class="md:col-span-3">
                        <input type="text" value="The Cat and the Dog" class="w-full p-3 " />
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-4 items-start">
                    <div class="md:col-span-1">
                        <label class="font-bold text-lg">Abstract</label>
                    </div>
                    <div class="md:col-span-3">
                        <textarea rows="6" class="w-full p-3 resize-none">meowmeowmeowmeowmeow</textarea>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-4 items-center">
                    <div class="md:col-span-1">
                        <label class="font-bold text-lg ">Date of Submission</label>
                    </div>
                    <div class="md:col-span-3">
                        <div class="inline-flex items-center ">
                            <input type="date" value="" class="w-full p-3" />
                        </div>
                    </div>
                </div>
                <hr class="border-white mb-6">

                <div class="grid grid-cols-1 md:grid-cols-4 items-center">
                    <div class="md:col-span-1">
                        <label class="font-bold text-lg">Keywords</label>
                    </div>
                    <div class="md:col-span-3">
                        <div class="flex flex-wrap items-center card-white p-2 space-x-2">
                            <div id="tags-container" class="flex flex-wrap items-center gap-2">
                            </div>
                            <input
                                    id="tag-input"
                                    type="text"
                                    placeholder="Add a keyword"
                                    class="flex-1 w-full"
                                    />
                        </div>
                        <p id="error-message" class="mt-2 text-sm text-red-500 hidden">You can only add up to 5 tags.</p>
                    </div>
                </div>
                
            </form>

        </div>
    </div>
</main>
<script>
    const input = document.getElementById('tag-input');
    const tagsContainer = document.getElementById('tags-container');
    const errorMessage = document.getElementById('error-message');
    let tags = [];

    input.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' && input.value.trim() !== '') {
            event.preventDefault();
            const newTag = input.value.trim();
            if (tags.length >= 5) {
                // Show error if the tag limit is exceeded
                errorMessage.classList.remove('hidden');
                return;
            } else {
                errorMessage.classList.add('hidden');
            }

            if (!tags.includes(newTag)) {
                tags.push(newTag);
                renderTags();
            }
            input.value = '';
        }
    });

    const renderTags = () => {
        tagsContainer.innerHTML = '';
        tags.forEach((tag, index) => {
            const tagElement = document.createElement('div');
            tagElement.className =
                'flex items-center bg-blue-100 text-blue-700 px-2 py-1 rounded-full text-sm';
            tagElement.innerHTML = `
        <span>${tag}</span>
        <button
          type="button"
          class="ml-2 text-blue-500 hover:text-blue-700"
          onclick="removeTag(${index})"
        >
          &times;
        </button>
      `;
            tagsContainer.appendChild(tagElement);
        });
    };

    const removeTag = (index) => {
        tags.splice(index, 1);
        renderTags();
        errorMessage.classList.add('hidden'); // Hide error message if a tag is removed
    };
</script>
{% endblock %}
