{% extends 'sidebar.html' %}

{% block title %} Submit Thesis {% endblock %}

{% block main %}
<main class="flex-1 flex flex-col gap-6">
    <div class="bg-sage-500 text-white p-6 md:p-8 flex-1 flex flex-col min-h-0 rounded-xl shadow-md">
        <h2 class="text-3xl font-bold mb-6 border-b border-white/30 pb-4">Thesis Submission Form</h2>

        <div class="flex-1 overflow-y-auto pr-2 custom-scrollbar">
            <form action="/submit-thesis" method="POST" enctype="multipart/form-data" id="thesis-form" class="flex flex-col gap-8 text-sage-900">
                
                <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                    <div class="md:col-span-1 pt-2">
                        <label class="font-bold text-lg text-white">Authors</label>
                    </div>
                    <div class="md:col-span-3 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                        <div class="flex flex-col gap-1">
                            <input name="author_first_name" type="text" class="w-full p-3 rounded-xl outline-none focus:ring-2 focus:ring-sage-300 transition" placeholder="John" />
                            <span class="text-sm italic text-sage-100">First Name</span>
                        </div>
                        <div class="flex flex-col gap-1">
                            <input name="author_last_name" type="text" class="w-full p-3 rounded-xl outline-none focus:ring-2 focus:ring-sage-300 transition" placeholder="Doe" />
                            <span class="text-sm italic text-sage-100">Last Name</span>
                        </div>
                        <div class="flex flex-col gap-1">
                            <input name="author_middle_name" type="text" class="w-full p-3 rounded-xl outline-none focus:ring-2 focus:ring-sage-300 transition" placeholder="Smith" />
                            <span class="text-sm italic text-sage-100">Middle Name</span>
                        </div>
                         <div class="flex flex-col gap-1">
                            <input name="student_number" type="text" class="w-full p-3 rounded-xl outline-none focus:ring-2 focus:ring-sage-300 transition" placeholder="2024-0001" />
                            <span class="text-sm italic text-sage-100">Student Number</span>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-4 gap-4 items-start">
                    <label class="font-bold text-lg text-white pt-3">Research Title</label>
                    <div class="md:col-span-3">
                        <input name="title" type="text" class="w-full p-3 rounded-xl outline-none focus:ring-2 focus:ring-sage-300 transition" placeholder="Enter full thesis title..." />
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-4 gap-4 items-start">
                    <label class="font-bold text-lg text-white pt-3">Abstract</label>
                    <div class="md:col-span-3">
                        <textarea name="abstract" rows="6" class="w-full p-3 rounded-xl resize-none outline-none focus:ring-2 focus:ring-sage-300 transition" placeholder="Write a brief summary of the research..."></textarea>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-4 gap-4 items-center">
                    <label class="font-bold text-lg text-white">Date Published</label>
                    <div class="md:col-span-3">
                        <input name="date" type="date" class="w-full p-3 rounded-xl outline-none focus:ring-2 focus:ring-sage-300 transition" />
                    </div>
                </div>

                <hr class="border-white/30 my-2">

                <div class="grid grid-cols-1 md:grid-cols-4 gap-4 items-center">
                    <label class="font-bold text-lg text-white">Program</label>
                    <div class="md:col-span-3">
                        <select name="program" class="w-full p-3 rounded-xl outline-none focus:ring-2 focus:ring-sage-300 transition bg-white">
                            {% for program in programs %}
                            <option value="{{ program.id }}">{{ program.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-4 gap-4 items-start">
                    <label class="font-bold text-lg text-white pt-3">Keywords</label>
                    <div class="md:col-span-3">
                        <div class="bg-white rounded-xl p-3 flex flex-wrap items-center gap-2 outline-none focus-within:ring-2 focus-within:ring-sage-300 transition">
                            <div id="tags-container" class="flex flex-wrap items-center gap-2"></div>
                            <input id="tag-input" type="text" placeholder="Type and press Enter" class="flex-1 min-w-[150px] p-1 border-none outline-none text-sage-900 bg-transparent" />
                            <input type="hidden" name="keywords" id="hidden-keywords">
                        </div>
                        <p id="error-message" class="mt-2 text-sm text-red-300 font-semibold hidden">You can only add up to 5 tags.</p>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-4 gap-4 items-center">
                    <label class="font-bold text-lg text-white">Document Details</label>
                    <div class="md:col-span-3 grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <select name="format" class="w-full p-3 rounded-xl outline-none focus:ring-2 focus:ring-sage-300 transition bg-white">
                            <option value="" disabled selected>Select Format</option>
                            {% for format in formats %}
                            <option value="{{ format.id }}">{{ format.format }}</option>
                            {% endfor %}
                        </select>
                        <select name="branch" class="w-full p-3 rounded-xl outline-none focus:ring-2 focus:ring-sage-300 transition bg-white">
                            <option value="" disabled selected>Select Branch</option>
                            {% for branch in branches %}
                            <option value="{{ branch.id }}">{{ branch.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-4 gap-4 items-center">
                    <label class="font-bold text-lg text-white">Attach Paper</label>
                    <div class="md:col-span-3">
                        <input name="file" type="file" class="w-full p-3 rounded-xl bg-white outline-none focus:ring-2 focus:ring-sage-300 transition file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-bold file:bg-sage-100 file:text-sage-700 hover:file:bg-sage-200 cursor-pointer" />
                    </div>
                </div>

                <div class="flex justify-end mt-4">
                    <button type="submit" class="bg-white text-sage-800 px-10 py-3 rounded-xl font-bold hover:bg-sage-50 transition shadow-md hover:-translate-y-1">
                        Submit Research
                    </button>
                </div>
            </form>
        </div>
    </div>
</main>

<script>
    const input = document.getElementById('tag-input');
    const tagsContainer = document.getElementById('tags-container');
    const errorMessage = document.getElementById('error-message');
    const form = document.getElementById('thesis-form');
    const hiddenKeywords = document.getElementById('hidden-keywords');
    let tags = [];

    input.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' && input.value.trim() !== '') {
            event.preventDefault();
            const newTag = input.value.trim();
            if (tags.length >= 5) {
                errorMessage.classList.remove('hidden');
                return;
            } else {
                errorMessage.classList.add('hidden');
            }

            if (!tags.includes(newTag)) {
                tags.push(newTag);
                renderTags();
            }
            input.value = '';
        }
    });

    form.addEventListener('submit', function(event) {
        hiddenKeywords.value = tags.join(', ');
    });

    const renderTags = () => {
        tagsContainer.innerHTML = '';
        tags.forEach((tag, index) => {
            const tagElement = document.createElement('div');
            // Updated tag styling to match the sage theme
            tagElement.className = 'flex items-center bg-sage-100 text-sage-800 px-3 py-1 rounded-full text-sm font-semibold shadow-sm';
            tagElement.innerHTML = `
                <span>${tag}</span>
                <button type="button" class="ml-2 text-sage-500 hover:text-red-500 transition font-bold" onclick="removeTag(${index})">
                  &times;
                </button>
            `;
            tagsContainer.appendChild(tagElement);
        });
    };

    const removeTag = (index) => {
        tags.splice(index, 1);
        renderTags();
        errorMessage.classList.add('hidden'); 
    };
</script>
{% endblock %}
