{% extends 'base.html' %}

{% block content %}
<div class="max-w-6xl mx-auto flex flex-col md:flex-row gap-6 md:h-[85dvh] md:min-h-[600px] pt-4">
    <aside class="w-full md:w-64 bg-theme-surface flex flex-col justify-between p-4 rounded-lg border border-theme-border shadow-sm">
        <nav class="flex flex-col gap-2">
            <a href="{{ url_for('admin.profile') if g.user['role'] == 'admin' else url_for('user.profile') }}" class="flex items-center gap-3 p-3 text-theme-text hover:bg-theme-secondary rounded-lg transition-colors font-bold">
                <i class="fa-solid fa-user text-theme-primary"></i> Profile
            </a>
            <a href="{{ url_for('admin.dashboard_stats') if g.user['role'] == 'admin' else url_for('user.dashboard') }}" class="flex items-center gap-3 p-3 text-theme-text hover:bg-theme-secondary rounded-lg transition-colors font-bold">
                <i class="fa-solid fa-chart-pie text-theme-primary"></i> Dashboard
            </a>
            
            {% if g.user and g.user['role'] == 'admin' %}
            <a href="{{ url_for('admin.review') }}" class="flex items-center justify-between p-3 text-theme-text hover:bg-theme-secondary rounded-lg transition-colors font-bold group">
                <div class="flex items-center gap-3">
                    <i class="fa-solid fa-list-check text-theme-primary"></i> Review Theses
                </div>
                {% if g.pending_count > 0 %}
                <span class="bg-red-500 text-white text-[10px] font-extrabold px-2 py-0.5 rounded-full shadow-sm group-hover:scale-110 transition-transform">
                    {{ g.pending_count }}
                </span>
                {% endif %}
            </a>
            <a href="{{ url_for('admin.history') }}" class="flex items-center gap-3 p-3 text-theme-text hover:bg-theme-secondary rounded-lg transition-colors font-bold">
                <i class="fa-solid fa-clock-rotate-left text-theme-primary"></i> History
            </a>
            {% else %}
            <a href="{{ url_for('user.bookmarks') }}" class="flex items-center gap-3 p-3 text-theme-text hover:bg-theme-secondary rounded-lg transition-colors font-bold">
                <i class="fa-solid fa-bookmark text-theme-primary"></i> Bookmarks
            </a>
            <a href="{{ url_for('user.history') }}" class="flex items-center gap-3 p-3 text-theme-text hover:bg-theme-secondary rounded-lg transition-colors font-bold">
                <i class="fa-solid fa-clock-rotate-left text-theme-primary"></i> History
            </a>
            {% endif %}

        </nav>
        
        <a href="{{ url_for('auth.logout') }}" class="flex items-center gap-3 p-3 text-theme-text hover:bg-theme-secondary rounded-lg transition-colors font-bold mt-4">
            <i class="fa-solid fa-right-from-bracket text-theme-primary"></i> Logout
        </a>
    </aside>
    {% block main %}{% endblock %}
</div>
{% endblock %}
