{% extends 'base.html' %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/read.js') }}"></script>
{% endblock %}

{% block title %} Reading - {{ thesis.title }} {% endblock %}

{% block content %}
<main class="container max-w-6xl mx-auto mt-6 min-h-0 h-[85vh] flex flex-col">
    <div class="flex justify-between items-center mb-4 bg-white p-4 pl-8 pr-8 rounded-xl shadow-sm border border-sage-100">
        <h2 class="text-2xl font-bold text-sage-900 truncate pr-4">{{ thesis.title }}</h2>
        
        <div class="flex items-center gap-4 shrink-0">
            <div class="text-red-600 font-bold bg-red-50 px-4 py-2 rounded-lg border border-red-200">
                <i class="fa-regular fa-clock"></i> &nbsp; Time Left: <span id="time-display" data-time-left="{{ time_left }}">--:--:--</span>
            </div>
            
            <a href="{{ url_for('archive.view', id=thesis_id) }}" 
               class="bg-sage-600 hover:bg-sage-700 text-white font-semibold py-2 px-4 rounded-lg shadow-sm transition-colors duration-200">
                Return to details
            </a>
        </div>
    </div>
    
    <div class="w-full flex-grow border-2 border-sage-300 rounded-xl overflow-hidden bg-gray-100 relative">
        <iframe src="{{ thesis.file_path }}#toolbar=0" width="100%" height="100%" class="w-full h-full border-none absolute inset-0"></iframe>
    </div>
</main>
{% endblock %}
