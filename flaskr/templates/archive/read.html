{% extends 'base.html' %}

{% block scripts %}
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
<script src="{{ url_for('static', filename='js/read.js') }}"></script>
{% endblock %}

{% block title %} Reading - {{ thesis.title }} {% endblock %}

{% block content %}
<main class="container max-w-6xl mx-auto mt-6 min-h-0 h-[85vh] flex flex-col">
    <div class="flex justify-between items-center mb-4 bg-theme-surface p-4 pl-8 pr-8 rounded-xl shadow-sm border border-theme-border transition-colors duration-300">
        
        <h2 class="text-2xl font-bold text-theme-text truncate pr-4">{{ thesis.title }}</h2>
        
        <div class="flex items-center gap-4 shrink-0">
            <div class="text-red-600 font-bold bg-red-50 px-4 py-2 rounded-lg border border-red-200">
                <i class="fa-regular fa-clock"></i> &nbsp; Time Left: <span id="time-display" data-time-left="{{ time_left }}">--:--:--</span>
            </div>
            
            <a href="{{ url_for('archive.view', id=thesis_id) }}" 
               class="bg-theme-primary hover:bg-theme-primary-hover text-white font-semibold py-2 px-4 rounded-lg shadow-sm transition-colors duration-200">
                Return to details
            </a>
        </div>
    </div>
    
    <div class="bg-theme-surface w-full flex-grow border-2 border-theme-border rounded-xl overflow-auto bg-theme-base relative transition-colors duration-300 flex flex-col items-center p-6">
        
        <div class="flex items-center gap-4 mb-6 sticky top-0 bg-theme-surface px-6 py-2 rounded-full shadow border border-theme-border z-10">
            <button id="prev-page" class="text-theme-text hover:text-theme-primary transition font-bold"><i class="fa-solid fa-chevron-left mr-1"></i> Prev</button>
            <span class="text-theme-muted font-bold text-sm">Page <span id="page-num" class="text-theme-text">1</span> of <span id="page-count" class="text-theme-text">--</span></span>
            <button id="next-page" class="text-theme-text hover:text-theme-primary transition font-bold">Next <i class="fa-solid fa-chevron-right ml-1"></i></button>
        </div>

        <canvas id="pdf-render" data-pdf-url="{{ thesis.file_path }}" class="shadow-xl rounded"></canvas>
    </div>
</main>
{% endblock %}
