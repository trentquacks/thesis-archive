{% extends 'base.html' %}

{% block title %} Home {% endblock %}

{% block content %}
<main class="max-w-6xl mx-auto mt-8 text-center ">
    <h2 class="text-3xl mb-8 font-bold text-sage-800">Browse Theses/Capstone Projects</h2>

    <div class="flex flex-col items-center justify-center mb-4 gap-4">
        <form action="{{ url_for('archive.search') }}" method="get" class="flex w-full max-w-lg shadow-sm rounded-full">
            <input name="q" type="text" placeholder="Enter search terms" class="w-full px-6 py-3 rounded-l-full border border-gray-300 border-r-0 italic outline-none text-sage-900">
            <button type="submit" class="bg-sage-500 px-6 rounded-r-full border border-sage-500 text-white flex items-center justify-center hover:brightness-90 transition">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>
        </form>
        <a href="{{ url_for('archive.search') }}" class="text-sage-600 font-bold hover:text-sage-800 transition underline decoration-sage-300 decoration-2 underline-offset-4">
            Browse all collections
        </a>
    </div> 
    <div class="grid grid-cols-1 md:grid-cols-3 gap-8 px-4">
        {% for department in departments %}
        <a href="{{ url_for('archive.search', dept_id=department.id ) }}" 
           class="rounded-xl p-8 flex flex-col items-center gap-4 shadow-md hover:scale-105 transition transform {{ 'bg-white text-sage-800' if department.id is even else 'bg-sage-500 text-white' }}">
            <span class="font-bold text-lg"> {{ department.name }} </span>
            <i class="fa-solid {{ department.icon }} text-5xl"></i>
        </a>
        {% endfor %}
    </div>

</main>
{% endblock %}
